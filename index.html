<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate XI - Mini Draft Game</title>
    <!-- Tailwind CSS CDN for instant styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="max-w-3xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 text-white shadow-2xl">
        
        <!-- Top Dashboard -->
        <div class="flex justify-between items-center bg-slate-950 p-4 rounded-xl border border-slate-800 mb-6">
            <div>
                <div class="text-xs text-slate-400 uppercase font-bold tracking-wider">Squad Rating</div>
                <div id="overallScore" class="text-3xl font-extrabold text-amber-400">0</div>
            </div>
            <div class="text-center">
                <div class="text-xs text-slate-400 uppercase font-bold tracking-wider">Chemistry</div>
                <div id="chemScore" class="text-3xl font-extrabold text-emerald-400">0%</div>
            </div>
            <div>
                <button onclick="resetDraft()" class="bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/30 text-xs px-3 py-2 rounded-lg font-bold transition-all flex items-center gap-1">
                    🔄 Reset
                </button>
            </div>
        </div>

        <!-- Pitch Grid (11 Formation Slots) -->
        <div id="draftPitch" class="grid grid-cols-4 sm:grid-cols-4 gap-3 bg-emerald-950/40 p-4 rounded-xl border border-emerald-500/20 min-h-[340px] mb-6">
            <!-- Rendered dynamically via JavaScript -->
        </div>

        <!-- Selection Modal -->
        <div id="selectionModal" class="hidden bg-slate-950 p-4 rounded-xl border border-amber-500/40">
            <div class="flex justify-between items-center mb-3">
                <span id="modalPosTitle" class="text-xs font-bold uppercase tracking-wider text-amber-400">Pick Player</span>
                <span class="text-[10px] text-slate-400">Select 1 Card</span>
            </div>
            <div id="cardsChoiceGrid" class="grid grid-cols-3 gap-3"></div>
        </div>

    </div>

<script>
// Real Player Database Pool organized by position
const playerPool = {
    LW: [
        { name: "K. Kvaratskhelia", rating: 87, club: "Napoli", nation: "Georgia" },
        { name: "Vinicius Jr.", rating: 89, club: "Real Madrid", nation: "Brazil" },
        { name: "L. Diaz", rating: 84, club: "Liverpool", nation: "Colombia" }
    ],
    ST: [
        { name: "E. Haaland", rating: 91, club: "Man City", nation: "Norway" },
        { name: "K. Mbappé", rating: 91, club: "Real Madrid", nation: "France" },
        { name: "L. Martinez", rating: 88, club: "Inter", nation: "Argentina" }
    ],
    RW: [
        { name: "M. Salah", rating: 89, club: "Liverpool", nation: "Egypt" },
        { name: "L. Yamal", rating: 83, club: "Barcelona", nation: "Spain" },
        { name: "Raphinha", rating: 84, club: "Barcelona", nation: "Brazil" }
    ],
    CAM: [
        { name: "J. Bellingham", rating: 90, club: "Real Madrid", nation: "England" },
        { name: "K. De Bruyne", rating: 91, club: "Man City", nation: "Belgium" },
        { name: "F. Wirtz", rating: 88, club: "Leverkusen", nation: "Germany" }
    ],
    CM: [
        { name: "F. Valverde", rating: 88, club: "Real Madrid", nation: "Uruguay" },
        { name: "Pedri", rating: 86, club: "Barcelona", nation: "Spain" },
        { name: "N. Barella", rating: 87, club: "Inter", nation: "Italy" }
    ],
    CDM: [
        { name: "Rodri", rating: 91, club: "Man City", nation: "Spain" },
        { name: "D. Rice", rating: 87, club: "Arsenal", nation: "England" },
        { name: "A. Tchouameni", rating: 85, club: "Real Madrid", nation: "France" }
    ],
    LB: [
        { name: "T. Hernandez", rating: 87, club: "AC Milan", nation: "France" },
        { name: "A. Robertson", rating: 85, club: "Liverpool", nation: "Scotland" },
        { name: "F. Mendy", rating: 83, club: "Real Madrid", nation: "France" }
    ],
    CB: [
        { name: "V. van Dijk", rating: 89, club: "Liverpool", nation: "Netherlands" },
        { name: "W. Saliba", rating: 87, club: "Arsenal", nation: "France" },
        { name: "R. Dias", rating: 88, club: "Man City", nation: "Portugal" }
    ],
    RB: [
        { name: "D. Carvajal", rating: 86, club: "Real Madrid", nation: "Spain" },
        { name: "J. Frimpong", rating: 84, club: "Leverkusen", nation: "Netherlands" },
        { name: "T. Alexander-Arnold", rating: 86, club: "Liverpool", nation: "England" }
    ],
    GK: [
        { name: "T. Courtois", rating: 90, club: "Real Madrid", nation: "Belgium" },
        { name: "A. Becker", rating: 89, club: "Liverpool", nation: "Brazil" },
        { name: "E. Martinez", rating: 87, club: "Aston Villa", nation: "Argentina" }
    ]
};

const pitchSlots = ["LW", "ST", "RW", "CAM", "CM", "CDM", "LB", "CB", "CB", "RB", "GK"];
let squad = new Array(11).fill(null);
let activeSlotIndex = null;

function renderPitch() {
    const pitch = document.getElementById('draftPitch');
    pitch.innerHTML = '';

    pitchSlots.forEach((pos, idx) => {
        const player = squad[idx];
        const cardBtn = document.createElement('div');
        
        const isLegend = player && player.rating >= 88;
        const borderStyle = isLegend 
            ? "border-amber-400 bg-amber-950/30 shadow-amber-500/20 shadow-lg ring-1 ring-amber-400/50" 
            : "border-slate-800 bg-slate-900/90";

        cardBtn.className = `p-3 border rounded-xl flex flex-col items-center justify-between cursor-pointer transition-all hover:scale-105 h-28 ${borderStyle}`;
        
        if (player) {
            cardBtn.innerHTML = `
                <span class="text-[9px] font-bold text-slate-400 uppercase">${pos}</span>
                <span class="text-xl font-black ${isLegend ? 'text-amber-400' : 'text-slate-200'}">${player.rating}</span>
                <span class="text-xs font-semibold text-white truncate w-full text-center">${player.name}</span>
                <span class="text-[9px] text-slate-400 truncate w-full text-center">${player.club}</span>
            `;
        } else {
            cardBtn.innerHTML = `
                <span class="text-[10px] font-bold text-amber-400 uppercase">${pos}</span>
                <span class="text-2xl font-bold text-slate-600 mt-1">+</span>
                <span class="text-[10px] text-slate-500">Pick</span>
            `;
            cardBtn.onclick = () => openPicker(pos, idx);
        }

        pitch.appendChild(cardBtn);
    });

    updateStats();
}

function openPicker(pos, slotIdx) {
    activeSlotIndex = slotIdx;
    const modal = document.getElementById('selectionModal');
    const grid = document.getElementById('cardsChoiceGrid');
    document.getElementById('modalPosTitle').innerText = `Pick a ${pos}`;
    
    grid.innerHTML = '';
    const choices = playerPool[pos] || playerPool['CM'];

    choices.forEach(player => {
        const isLegend = player.rating >= 88;
        const card = document.createElement('div');
        card.className = `p-3 rounded-xl border ${isLegend ? 'border-amber-400 bg-amber-500/10 shadow-amber-500/10 shadow-md' : 'border-slate-800 bg-slate-900'} cursor-pointer hover:border-emerald-400 hover:scale-105 transition-all text-center`;
        card.innerHTML = `
            <div class="text-2xl font-black ${isLegend ? 'text-amber-400' : 'text-slate-200'}">${player.rating}</div>
            <div class="text-xs font-bold text-white truncate">${player.name}</div>
            <div class="text-[10px] text-slate-400">${player.club} • ${player.nation}</div>
        `;
        card.onclick = () => selectCard(player);
        grid.appendChild(card);
    });

    modal.classList.remove('hidden');
}

function selectCard(player) {
    if (activeSlotIndex !== null) {
        squad[activeSlotIndex] = player;
    }
    document.getElementById('selectionModal').classList.add('hidden');
    renderPitch();
}

function updateStats() {
    const picked = squad.filter(p => p !== null);
    if (picked.length === 0) {
        document.getElementById('overallScore').innerText = '0';
        document.getElementById('chemScore').innerText = '0%';
        return;
    }

    // Calculate Average Rating
    const avgRating = Math.round(picked.reduce((acc, p) => acc + p.rating, 0) / picked.length);
    document.getElementById('overallScore').innerText = avgRating;

    // Calculate Chemistry based on matching clubs/nations
    let chemBonus = 0;
    for (let i = 0; i < picked.length; i++) {
        for (let j = i + 1; j < picked.length; j++) {
            if (picked[i].club === picked[j].club) chemBonus += 10;
            if (picked[i].nation === picked[j].nation) chemBonus += 6;
        }
    }

    const totalChem = Math.min(100, Math.round((picked.length / 11) * 35 + chemBonus));
    document.getElementById('chemScore').innerText = `${totalChem}%`;
}

function resetDraft() {
    squad = new Array(11).fill(null);
    document.getElementById('selectionModal').classList.add('hidden');
    renderPitch();
}

// Initializing Pitch on Load
renderPitch();
</script>

</body>
</html>
